<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>캔버스와 탱크 시뮬레이터 스트리밍</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            position: relative;
            overflow-x: auto;
        }
        canvas {
            border: 1px solid black;
            float: left;
            margin-right: 20px;
        }
        #coordinates {
            margin-top: 10px;
            font-family: Arial, sans-serif;
            text-align: left;
            clear: both;
        }
        #simulatorContainer {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 400px;
            height: 300px;
        }
        #simulatorStream {
            width: 100%;
            height: 100%;
            border: 1px solid black;
        }
    </style>
    <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
    <script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>
</head>
<body>
    <div id="simulatorContainer">
        <video id="simulatorStream" class="video-js vjs-default-skin" controls autoplay muted>
            <source src="http://localhost/hls/tank_simulator.m3u8" type="application/x-mpegURL">
            Your browser does not support the video tag.
        </video>
    </div>
    <canvas id="myCanvas" width="900" height="900"></canvas>
    <div id="coordinates">클릭한 좌표: (x: 0, z: 0)</div>
    <script>
        const canvas = document.getElementById('myCanvas');
        const ctx = canvas.getContext('2d');
        const coordDisplay = document.getElementById('coordinates');

        const img = new Image();
        const img2 = new Image();
        let currentFlag = null;
        const baseMapUrl = 'https://th.bing.com/th/id/OIP.PGHm7YGxXS_OK9f04nFkrgHaGe?rs=1&pid=ImgDetMain';
        img2.src = 'https://cdn-icons-png.flaticon.com/512/854/854884.png';

        function refreshMap() {
            img.src = `${baseMapUrl}?t=${new Date().getTime()}`;
            img.onload = function() {
                ctx.clearRect(0, 0, 900, 900);
                ctx.drawImage(img, 0, 0, 900, 900);
                ctx.strokeStyle = 'black';
                ctx.strokeRect(0, 0, 900, 900);
                if (currentFlag && img2.complete) {
                    ctx.drawImage(img2, currentFlag.x, currentFlag.z, 30, 30);
                }
                console.log('맵 갱신 완료');
            };
            img.onerror = function() {
                console.error('맵 이미지 로드 실패');
                ctx.fillStyle = 'white';
                ctx.fillRect(0, 0, 900, 900);
                ctx.strokeStyle = 'black';
                ctx.strokeRect(0, 0, 900, 900);
            };
        }

        refreshMap();

        img2.onload = function() {
            console.log('깃발 이미지 로드 완료');
            if (currentFlag) {
                ctx.drawImage(img2, currentFlag.x, currentFlag.z, 30, 30);
            }
        };

        img2.onerror = function() {
            console.error('깃발 이미지 로드 실패');
        };

        async function sendCoordinatesToSimulator(x, z) {
            try {
                const response = await fetch('http://localhost:3000/api/coordinates', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ x: x, z: z })
                });
                console.log(`좌표 전송: x=${x}, z=${z}`);
            } catch (error) {
                console.error('좌표 전송 실패:', error);
            }
        }

        const refreshArea = {
            xMin: 0,
            xMax: 100,
            zMin: 0,
            zMax: 100
        };

        canvas.addEventListener('click', (event) => {
            const rect = canvas.getBoundingClientRect();
            const x = Math.round(event.clientX - rect.left);
            const z = Math.round(event.clientY - rect.top);
            if (event.button === 0) {
                if (x >= refreshArea.xMin && x <= refreshArea.xMax &&
                    z >= refreshArea.zMin && z <= refreshArea.zMax) {
                    refreshMap();
                    return;
                }
                const xNew = x / 3;
                const zNew = z / 3;
                coordDisplay.textContent = `(x: ${xNew.toFixed(1)}, z: ${zNew.toFixed(1)})`;
            }
        });

        canvas.addEventListener('contextmenu', (event) => {
            event.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const x = Math.round(event.clientX - rect.left);
            const z = Math.round(event.clientY - rect.top);
            const xNew = x / 3;
            const zNew = z / 3;
            const xNew_1 = x - 15;
            const zNew_1 = z - 15;

            currentFlag = { x: xNew_1, z: zNew_1 };

            ctx.clearRect(0, 0, 900, 900);
            ctx.drawImage(img, 0, 0, 900, 900);
            ctx.strokeStyle = 'black';
            ctx.strokeRect(0, 0, 900, 900);

            if (img2.complete && currentFlag) {
                ctx.drawImage(img2, currentFlag.x, currentFlag.z, 30, 30);
            } else {
                console.warn('깃발 이미지가 아직 로드되지 않음');
            }

            sendCoordinatesToSimulator(xNew, zNew);

            coordDisplay.textContent = `move (x: ${xNew.toFixed(1)}, z: ${zNew.toFixed(1)})`;
        });

        canvas.addEventListener('dblclick', (event) => {
            currentFlag = null;
            ctx.clearRect(0, 0, 900, 900);
            ctx.drawImage(img, 0, 0, 900, 900);
            ctx.strokeStyle = 'black';
            ctx.strokeRect(0, 0, 900, 900);
            coordDisplay.textContent = '깃발 삭제됨';
        });

        videojs('simulatorStream', {
            controls: true,
            autoplay: true,
            muted: true,
            fluid: true,
            errorDisplay: true,
            liveui: true,
            liveTracker: {
                trackingThreshold: 0,
                liveTolerance: 1
            }
        }).on('error', (e) => {
            console.error('Video.js 오류:', e);
        });
    </script>
</body>
</html>
